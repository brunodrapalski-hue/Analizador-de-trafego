# Em push na main e em pull requests, em máquina limpa: portão de qualidade,
# build da imagem e scan de vulnerabilidades.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o pipeline apenas lê o repositório.
permissions:
  contents: read

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    steps:
      # As actions são fixadas pelo hash (SHA) do commit, e não pela tag de
      # versão, para proteger contra ataques de cadeia de suprimentos.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mesmo script usado localmente: lint, formatação, testes, bandit e
      # pip-audit.
      - name: Lint, tests, SAST and dependency audit
        run: docker compose run --rm -T --build quality

      - name: Build runtime image
        run: docker compose build analyzer

      # Relatório completo (HIGH e CRITICAL), sem bloquear o build.
      - name: Image scan report (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: traffic-analyzer:1.0.0
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      # Portão: o build falha somente se houver vulnerabilidade CRITICAL com
      # correção disponível (ou seja, acionável). Ver D13 em docs/decisoes.md.
      - name: Image scan gate (fixable CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: traffic-analyzer:1.0.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
