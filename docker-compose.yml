services:
  analyzer:
    build:
      context: .
      target: runtime
    image: traffic-analyzer:1.0.0
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./data:/app/data
      - ./samples:/app/samples:ro

  tests:
    build:
      context: .
      target: test
    image: traffic-analyzer-tests:1.0.0
    profiles: ["test"]
